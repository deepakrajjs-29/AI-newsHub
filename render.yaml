services:
  - type: web
    name: ai-news-hub
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gemini-1.5-flash
      - key: CRON_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false

